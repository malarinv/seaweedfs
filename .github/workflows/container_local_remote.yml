name: "docker: build local-remote-storage containers"

# Build the multi-arch dev containers for the feat/local-remote-storage
# branch. Mirrors container_dev.yml but pushes to the malarinv/seaweedfs
# package on ghcr.io and only triggers on the feature branch.
#
# Push to:  ghcr.io/malarinv/seaweedfs:feat-local-remote-storage-{amd64,arm64,multi}
# Tag scheme:
#   :feat-local-remote-storage-amd64     single-arch amd64
#   :feat-local-remote-storage-arm64     single-arch arm64
#   :feat-local-remote-storage-multi     multi-arch manifest (amd64+arm64)
#
# The "multi" tag is what the cluster pulls; single-arch tags are kept for
# debugging the individual platforms.

on:
  push:
    branches: [ feat/local-remote-storage ]
    paths:
      - 'weed/**'
      - 'seaweed-volume/**'
      - 'seaweed-worker/**'
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/container_local_remote.yml'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Tag suffix (default: feat-local-remote-storage)'
        required: false
        default: 'feat-local-remote-storage'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/malarinv/seaweedfs
  TAG_SUFFIX: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_suffix || 'feat-local-remote-storage' }}

concurrency:
  group: local-remote-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Pre-build the Rust binaries natively ────────────────────────────
  # Same trick container_dev.yml uses: cross-compile to aarch64-musl
  # natively so QEMU does not have to emulate the entire Rust toolchain.
  build-rust-binaries:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
            cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (amd64)
        if: ${{ !matrix.cross }}
        run: sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (arm64)
        if: matrix.cross
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CFLAGS_aarch64_unknown_linux_musl=-U_FORTIFY_SOURCE" >> "$GITHUB_ENV"

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            seaweed-volume/target
            seaweed-worker/target/${{ matrix.target }}/release
          key: rust-local-remote-${{ matrix.target }}-${{ hashFiles('seaweed-volume/Cargo.lock', 'seaweed-worker/Cargo.lock') }}
          restore-keys: |
            rust-local-remote-${{ matrix.target }}-

      - name: Use the vendored protoc
        run: |
          cd seaweed-worker
          cargo fetch
          version=$(awk '/^name = "protoc-bin-vendored-linux-x86_64"$/{found=1; next} found && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.lock)
          test -n "$version" || { echo "protoc-bin-vendored-linux-x86_64 is not in Cargo.lock" >&2; exit 1; }
          protoc=$(find ~/.cargo/registry/src -path "*protoc-bin-vendored-linux-x86_64-$version/bin/protoc" | head -1)
          test -x "$protoc" || { echo "no vendored protoc $version in the registry" >&2; exit 1; }
          echo "PROTOC=$protoc" >> "$GITHUB_ENV"

      - name: Build normal variant
        env:
          SEAWEEDFS_COMMIT: ${{ github.sha }}
        run: |
          cd seaweed-volume
          cargo build --release --target ${{ matrix.target }} --no-default-features
          cp target/${{ matrix.target }}/release/weed-volume ../weed-volume-normal-${{ matrix.arch }}

      - name: Build the Rust maintenance worker
        run: |
          cd seaweed-worker
          cargo build --release -p weed-lance-worker --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/weed-worker ../weed-worker-${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust-bins-local-remote-${{ matrix.arch }}
          path: |
            weed-volume-normal-${{ matrix.arch }}
            weed-worker-${{ matrix.arch }}

  # Build each platform natively; tag by digest so the merge step can
  # assemble a multi-arch manifest.
  build:
    needs: [build-rust-binaries]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download pre-built Rust binaries
        uses: actions/download-artifact@v8
        with:
          pattern: rust-bins-local-remote-*
          merge-multiple: true
          path: ./rust-bins

      - name: Place Rust binaries in Docker context
        run: |
          mkdir -p docker/weed-volume-prebuilt
          mkdir -p docker/weed-worker-prebuilt
          for arch in amd64 arm64; do
            src="./rust-bins/weed-volume-normal-${arch}"
            if [ -f "$src" ]; then
              cp "$src" "docker/weed-volume-prebuilt/weed-volume-${arch}"
            fi
            src="./rust-bins/weed-worker-${arch}"
            if [ -f "$src" ]; then
              cp "$src" "docker/weed-worker-prebuilt/weed-worker-${arch}"
            fi
          done

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo docker system prune -af --volumes
          [ -d ~/.cache/go-build ] && rm -rf ~/.cache/go-build || true
          [ -d /go/pkg ] && rm -rf /go/pkg || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILDKIT: 1
        with:
          context: ./docker
          file: ./docker/Dockerfile.go_build
          platforms: ${{ matrix.platform }}
          # Flat single-platform manifest, push by digest so the merge step
          # can stitch a multi-arch index. This is the same shape
          # container_release_unified.yml produces.
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=local-remote-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=local-remote-${{ matrix.arch }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BRANCH=${{ github.ref_name }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-local-remote-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-platform digests into a multi-arch manifest at
  # $TAG_SUFFIX-multi, plus the per-platform tag for direct debugging.
  merge:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-local-remote-*
          merge-multiple: true
          path: /tmp/digests
          if-no-files-found: error

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch manifest
        run: |
          set -eu
          # Translate the digest files (named by sha256) into a list the
          # buildx imagetools command expects: tag@sha256:... per arch.
          args=()
          for f in /tmp/digests/*; do
            [ -e "$f" ] || continue
            sha=$(basename "$f")
            arch=$(echo "$f" | sed -nE 's/.*digest-local-remote-(amd64|arm64).*/\1/p')
            args+=("--tag" "${{ env.IMAGE }}:${{ env.TAG_SUFFIX }}-${arch}@sha256:${sha}")
          done
          # Multi-arch manifest tag, layered on top of the per-arch tags.
          args+=("--tag" "${{ env.IMAGE }}:${{ env.TAG_SUFFIX }}-multi")
          echo "manifest args:"
          printf '  %s\n' "${args[@]}"
          docker buildx imagetools create "${args[@]}"

  test:
    needs: [build]
    runs-on: ubuntu-latest
    # Smoke-test the freshly-built image by running weed -version and the
    # remote.configure help to confirm the new local backend is registered.
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test amd64
        run: |
          docker run --rm "${{ env.IMAGE }}:${{ env.TAG_SUFFIX }}-amd64" -version
          # Help text should mention the new -local.path flag.
          docker run --rm "${{ env.IMAGE }}:${{ env.TAG_SUFFIX }}-amd64" shell -h 2>&1 | grep -q "remote.configure"
          docker run --rm "${{ env.IMAGE }}:${{ env.TAG_SUFFIX }}-amd64" shell -h 2>&1 | grep -q "type=local"
